<!DOCTYPE html>
<html>
<head>
    <title>Noblesville Boys XC</title>

    <link rel="stylesheet" href="styles.css">

    <!-- config FIRST -->
    <script src="config.js"></script>
</head>
<body>

<header>
    <h1>Noblesville Boys Cross Country</h1>
</header>

<main>
    <div class="athlete-selector">
        <label for="athleteDropdown">Select Athlete:</label>
        <select id="athleteDropdown"></select>
        <p>Your last opened athlete will open automatically on this device.</p>
    </div>

    <div id="status"></div>

    <div id="athleteData"></div>

    <section class="card runner-resources" aria-labelledby="runner-resources-title">
        <h3 id="runner-resources-title">RUNNER RESOURCES</h3>
        <a class="resource-link"
           href="https://drive.google.com/file/d/1cvPvW3oh9TGcm0XtU0oAe7xHhRwWEh7v/view"
           target="_blank"
           rel="noopener noreferrer">
            <span class="resource-copy">
                <strong>Mobility &amp; Exercise Library</strong>
                <span>Videos and guidance for mobility, stretching, and recovery</span>
            </span>
            <span class="resource-action" aria-hidden="true">OPEN ↗</span>
        </a>
    </section>
</main>

<!-- app LAST -->
<script src="columbus-race-plan.js"></script>
<script src="app.js"></script>

</body>
</html>
